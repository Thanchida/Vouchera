spring.application.name=backend
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:vouchera_test}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Optional bootstrap admin account. If no admin exists yet, the app will create one on startup.
vouchera.bootstrap.admin-email=${VOUCHERA_BOOTSTRAP_ADMIN_EMAIL:}
vouchera.bootstrap.admin-password=${VOUCHERA_BOOTSTRAP_ADMIN_PASSWORD:}

cors.allowed-origins=${VOUCHERA_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Periodic lifecycle synchronization for campaign status transitions (milliseconds)
campaign.status-sync.fixed-delay-ms=${CAMPAIGN_STATUS_SYNC_FIXED_DELAY_MS:30000}