services:
  db:
    image: postgres:17-alpine
    container_name: vouchera-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - vouchera-net

  flyway:
    image: flyway/flyway:latest
    platform: linux/arm64
    container_name: vouchera-flyway
    restart: "no"
    command:
      - -url=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - -user=${POSTGRES_USER}
      - -password=${POSTGRES_PASSWORD}
      - -connectRetries=30
      - -locations=filesystem:/flyway/sql
      - migrate
    volumes:
      - ./backend/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vouchera-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vouchera-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      VOUCHERA_CORS_ALLOWED_ORIGINS: ${VOUCHERA_CORS_ALLOWED_ORIGINS}
      VOUCHERA_BOOTSTRAP_ADMIN_EMAIL: ${VOUCHERA_BOOTSTRAP_ADMIN_EMAIL}
      VOUCHERA_BOOTSTRAP_ADMIN_PASSWORD: ${VOUCHERA_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    networks:
      - vouchera-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: vouchera-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - vouchera-net

networks:
  vouchera-net:
    driver: bridge

volumes:
  postgres_data:
